<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="title">Pomodoro Timer</h1>
            <p class="subtitle" id="session-type">Work Session</p>
        </header>

        <main>
            <div class="timer-display">
                <svg class="timer-circle" viewBox="0 0 200 200">
                    <circle class="timer-circle-bg" cx="100" cy="100" r="90"></circle>
                    <circle class="timer-circle-progress" cx="100" cy="100" r="90" id="progress-circle"></circle>
                </svg>
                <div class="timer-text" id="timer-display">25:00</div>
            </div>

            <div class="session-info">
                <p id="session-counter">Session 1 of 4</p>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="start-btn">Start</button>
                <button class="btn btn-secondary" id="pause-btn" disabled>Pause</button>
                <button class="btn btn-secondary" id="reset-btn">Reset</button>
                <button class="btn btn-secondary" id="skip-btn">Skip</button>
                <button class="btn btn-secondary" id="settings-btn">Settings</button>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="setting-group">
                    <label for="work-duration">Work Duration (minutes):</label>
                    <input type="number" id="work-duration" min="1" max="60" value="25">
                </div>
                <div class="setting-group">
                    <label for="short-break-duration">Short Break Duration (minutes):</label>
                    <input type="number" id="short-break-duration" min="1" max="30" value="5">
                </div>
                <div class="setting-group">
                    <label for="long-break-duration">Long Break Duration (minutes):</label>
                    <input type="number" id="long-break-duration" min="1" max="60" value="20">
                </div>
                <div class="setting-group">
                    <label for="sessions-until-long-break">Sessions Until Long Break:</label>
                    <input type="number" id="sessions-until-long-break" min="2" max="10" value="4">
                </div>
                <div class="setting-group checkbox-group">
                    <label for="audio-alerts">
                        <input type="checkbox" id="audio-alerts" checked>
                        Enable Audio Alerts
                    </label>
                </div>
                <div class="setting-group checkbox-group">
                    <label for="browser-notifications">
                        <input type="checkbox" id="browser-notifications" checked>
                        Enable Browser Notifications
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="reset-defaults-btn">Reset to Defaults</button>
                <button class="btn btn-primary" id="save-settings-btn">Save</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/timer-state.js') }}"></script>
    <script src="{{ url_for('static', filename='js/api-client.js') }}"></script>
    <script src="{{ url_for('static', filename='js/settings.js') }}"></script>
    <script src="{{ url_for('static', filename='js/timer-controller.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
